name: ai-doc-assistant

services:
  frontend:
    build: .
    ports:
      - "3100:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8100/api/v1
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: ./backend
      args:
        INSTALL_OCR: ${INSTALL_OCR:-false}
        INSTALL_CRAWL: ${INSTALL_CRAWL:-false}
    ports:
      - "8100:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://aidoc:aidoc@postgres:5432/aidoc
      QDRANT_URL: http://qdrant:6333
      OPENSEARCH_URL: http://opensearch:9200
      MINIO_ENDPOINT: minio:9000
      CORS_ORIGINS: http://localhost:3100
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      opensearch:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aidoc
      POSTGRES_USER: aidoc
      POSTGRES_PASSWORD: aidoc
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidoc -d aidoc"]
      interval: 5s
      timeout: 5s
      retries: 12

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6433:6333"
      - "6434:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  opensearch:
    image: opensearchproject/opensearch:3.2.0
    environment:
      discovery.type: single-node
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9300:9200"
      - "9700:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.3
    profiles: ["elastic"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9301:9200"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 8s
      timeout: 5s
      retries: 12

  vllm:
    image: vllm/vllm-openai:latest
    profiles: ["gpu"]
    command:
      - --model
      - ${QWEN_PRIMARY_MODEL:-Qwen/Qwen3-VL-30B-A3B-Instruct}
      - --served-model-name
      - ${QWEN_PRIMARY_MODEL:-Qwen/Qwen3-VL-30B-A3B-Instruct}
      - --trust-remote-code
      - --max-model-len
      - "32768"
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    ports:
      - "8101:8000"
    volumes:
      - hf_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  postgres_data:
  qdrant_data:
  opensearch_data:
  elastic_data:
  minio_data:
  hf_cache:
